<html lang="id">
<head>

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.3);
            --aero-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #f0f4ff 0%, #ffffff 40%, #fdf2f8 100%);
            background-attachment: fixed; color: #1e293b; overflow-x: hidden; -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: var(--glass-bg); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); box-shadow: var(--aero-shadow);
        }
        .aero-blur { backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); }
        .animate-float { animation: float 6s ease-in-out infinite; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .gradient-text { background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tap-scale { transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .tap-scale:active { transform: scale(0.95); }
        .animate-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .upload-area {
            position: relative; width: 100%; min-height: 120px;
            border: 2px dashed #cbd5e1; border-radius: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            transition: all 0.3s ease; cursor: pointer; flex-wrap: wrap; padding: 10px; gap: 10px;
        }
        .upload-area:hover { border-color: #f59e0b; background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%); }
        .upload-placeholder { text-align: center; color: #64748b; z-index: 1; width: 100%; }
        .preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; width: 100%; }
        .preview-item { position: relative; width: 100%; aspect-ratio: 1; border-radius: 0.75rem; overflow: hidden; border: 2px solid #10b981; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        .remove-photo-btn {
            position: absolute; top: 4px; right: 4px; width: 24px; height: 24px;
            background: rgba(244, 63, 94, 0.95); color: white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3;
        }
        .nav-btn { transition: all 0.3s ease; }
        .nav-btn.active { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); }
        .table-container { overflow-x: auto; }
        .custom-table { width: 100%; border-collapse: separate; border-spacing: 0; }
        .custom-table th { background: rgba(99, 102, 241, 0.1); color: #4f46e5; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; padding: 12px; text-align: left; position: sticky; top: 0; }
        .custom-table td { padding: 12px; font-size: 12px; font-weight: 600; color: #475569; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .custom-table tr:hover td { background: rgba(99, 102, 241, 0.03); }
        .tab-btn {
            padding: 0.75rem 1.5rem; border-radius: 1rem; font-weight: 800; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.05em; transition: all 0.3s ease;
            background: rgba(255,255,255,0.5); color: #64748b;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #6366f1, #a855f7); color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .tab-btn:hover:not(.active) { background: rgba(255,255,255,0.8); color: #4f46e5; }
        input[type="date"], select { color: #475569; }
        input[type="date"]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 0.6; transition: 0.2s; }
        input[type="date"]::-webkit-calendar-picker-indicator:hover { opacity: 1; }
        
        .modal-backdrop { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .modal-slide-in { animation: modalSlide 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes modalSlide { from { opacity: 0; transform: translateY(40px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        
        .searchable-dropdown { position: relative; }
        .dropdown-list {
            position: absolute; top: 100%; left: 0; right: 0; max-height: 250px; overflow-y: auto;
            background: white; border: 2px solid #e2e8f0; border-radius: 0.75rem; margin-top: 0.25rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); z-index: 50; display: none;
        }
        .dropdown-list.active { display: block; }
        .dropdown-item { padding: 0.75rem 1rem; cursor: pointer; border-bottom: 1px solid #f1f5f9; transition: all 0.2s; }
        .dropdown-item:hover { background: #f8fafc; }
        .dropdown-item:last-child { border-bottom: none; }
        .no-results { padding: 1rem; text-align: center; color: #94a3b8; font-size: 0.875rem; }
    </style>
</head>
<body class="min-h-screen">
    <div id="statusToast" class="hidden fixed top-6 inset-x-4 z-[300] flex justify-center transform transition-all duration-300 pointer-events-none">
        <div id="toastContent" class="aero-blur bg-white/95 border px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 pointer-events-auto">
            <i id="toastIcon" data-lucide="info" class="w-5 h-5"></i>
            <span id="toastMessage" class="font-bold text-sm tracking-tight text-slate-700">Pesan</span>
        </div>
    </div>

    <!-- MODAL EDIT STATUS -->
    <div id="statusModal" class="hidden fixed inset-0 z-[200] modal-backdrop flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md rounded-[2rem] overflow-hidden modal-slide-in bg-white/95">
            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 p-6 relative overflow-hidden">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-white/10 rounded-full"></div>
                <div class="relative flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm"><i data-lucide="edit-3" class="w-6 h-6 text-white"></i></div>
                    <div><h2 class="text-lg font-black text-white tracking-tight">Ubah Status</h2><p class="text-[10px] font-bold text-white/80 uppercase tracking-widest">Khusus Admin</p></div>
                </div>
            </div>
            <div class="p-6 space-y-4">
                <div class="bg-slate-50 p-4 rounded-2xl"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Nama Barang/Alat</p><p id="modalItemName" class="text-sm font-bold text-slate-800">-</p></div>
                <div class="bg-slate-50 p-4 rounded-2xl"><p class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Status Saat Ini</p><p id="modalCurrentStatus" class="text-sm font-bold text-slate-800">-</p></div>
                <div class="space-y-2"><label class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Pilih Status Baru</label><div id="modalStatusOptions" class="grid grid-cols-1 gap-2"></div></div>
            </div>
            <div class="p-4 bg-slate-50/80 backdrop-blur-md border-t border-slate-100 flex gap-3">
                <button type="button" onclick="closeStatusModal()" class="tap-scale flex-1 py-4 bg-white border-2 border-slate-200 text-slate-600 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-50 transition-colors">Batal</button>
                <button type="button" id="btnConfirmStatus" onclick="confirmStatusChange()" class="tap-scale flex-1 py-4 bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-indigo-500/30 flex items-center justify-center gap-2"><i data-lucide="check" class="w-4 h-4"></i><span>Simpan</span></button>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT DATA -->
    <div id="editModal" class="hidden fixed inset-0 z-[200] modal-backdrop flex items-center justify-center p-4">
        <div class="glass-card w-full max-w-md rounded-[2rem] overflow-hidden modal-slide-in bg-white/95 max-h-[90vh] flex flex-col">
            <div class="bg-gradient-to-r from-amber-500 to-orange-500 p-6 relative overflow-hidden flex-shrink-0">
                <div class="absolute -right-6 -top-6 w-32 h-32 bg-white/10 rounded-full"></div>
                <div class="relative flex items-center gap-3">
                    <div class="w-12 h-12 bg-white/20 rounded-2xl flex items-center justify-center backdrop-blur-sm"><i data-lucide="pencil" class="w-6 h-6 text-white"></i></div>
                    <div><h2 class="text-lg font-black text-white tracking-tight">Edit Data</h2><p class="text-[10px] font-bold text-white/80 uppercase tracking-widest">Perbarui Informasi</p></div>
                </div>
            </div>
            <div class="p-6 space-y-4 overflow-y-auto flex-1" id="editModalContent"></div>
            <div class="p-4 bg-slate-50/80 backdrop-blur-md border-t border-slate-100 flex gap-3 flex-shrink-0">
                <button type="button" onclick="closeEditModal()" class="tap-scale flex-1 py-4 bg-white border-2 border-slate-200 text-slate-600 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-50 transition-colors">Batal</button>
                <button type="button" onclick="saveEditData()" class="tap-scale flex-1 py-4 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-2xl font-black text-xs uppercase tracking-widest shadow-lg shadow-amber-500/30 flex items-center justify-center gap-2"><i data-lucide="save" class="w-4 h-4"></i><span>Simpan Perubahan</span></button>
            </div>
        </div>
    </div>

    <div id="loginPage" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-md glass-card rounded-[3rem] p-10 space-y-10 relative overflow-hidden animate-in">
            <div class="absolute top-0 right-0 p-8 opacity-5"><i data-lucide="package" class="w-32 h-32"></i></div>
            <div class="text-center space-y-4">
                <div class="w-32 h-32 flex items-center justify-center mx-auto animate-float">
                    <img src="https://lh3.googleusercontent.com/d/15zyF01OHtEgTl8p6bvEkz7xw30ByE2en" alt="Logo Sekolah" class="w-full h-full object-contain drop-shadow-2xl" onerror="this.src='https://ui-avatars.com/api/?name=SMK&background=6366f1&color=fff'">
                </div>
                <div class="space-y-1"><h1 class="text-3xl font-black gradient-text tracking-tighter">E-Sarpras</h1><p class="text-slate-400 text-[11px] font-bold tracking-widest uppercase">SMK Negeri 2 Tegalsari</p></div>
            </div>
            <div class="space-y-6">
                <div class="relative group"><i data-lucide="user" class="absolute left-5 top-5 w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i><input type="text" id="loginUser" class="w-full pl-14 pr-6 py-5 bg-white/30 border border-white/20 rounded-2xl text-sm font-bold focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none" placeholder="Username"></div>
                <div class="relative group"><i data-lucide="key-round" class="absolute left-5 top-5 w-5 h-5 text-slate-400 group-focus-within:text-indigo-500 transition-colors"></i><input type="password" id="loginPass" class="w-full pl-14 pr-6 py-5 bg-white/30 border border-white/20 rounded-2xl text-sm font-bold focus:bg-white focus:ring-4 focus:ring-indigo-500/10 transition-all outline-none" placeholder="Password"></div>
                <button id="btnLogin" onclick="handleLogin()" class="tap-scale w-full py-5 bg-gradient-to-r from-indigo-600 to-indigo-700 text-white rounded-[2rem] font-black text-sm tracking-[0.2em] shadow-xl shadow-indigo-500/20 uppercase transition-all">Masuk Aplikasi</button>
            </div>
        </div>
    </div>

    <div id="mainPage" class="hidden p-4 md:p-8 animate-in pb-24">
        <div class="max-w-6xl mx-auto space-y-6">
            <div class="flex items-center justify-between glass-card p-4 rounded-[2rem] sticky top-4 z-50">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-500 rounded-xl flex items-center justify-center text-white shadow-lg"><i data-lucide="package" class="w-5 h-5"></i></div>
                    <div><h1 id="displayNama" class="text-sm font-black text-slate-800 truncate max-w-[150px]">Memuat...</h1><p id="displayRole" class="text-[9px] font-bold text-slate-400 uppercase tracking-tight"></p></div>
                </div>
                <button onclick="handleLogout()" class="tap-scale w-10 h-10 flex items-center justify-center bg-rose-500/10 text-rose-500 rounded-xl hover:bg-rose-500/20 transition-colors"><i data-lucide="power" class="w-5 h-5"></i></button>
            </div>
            <div id="navMenu" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3"></div>
            <div id="contentArea" class="glass-card rounded-[2.5rem] p-6 md:p-8 min-h-[400px]"></div>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwWDpU0cdCdsKYaALxWuDAkfSKWkU4UDZBx2El1swl3ipVa9uiahNyN9xFH53fSHJ1DNQ/exec";
        let currentUser = null, currentImagesBase64 = [], currentBuktiBase64 = [], currentBuktiMultiple = [];
        let allInventoryData = [], allBantuanData = [], allRusakData = [], allPeminjamanData = [], allPengeluaranData = [];
        let kodeBarangData = [];
        let currentEditItem = null, selectedNewStatus = null, currentEditRow = null, currentEditSheet = null;
        lucide.createIcons();

                const satuanOptionsHTML = `
            <select class="w-full px-4 py-3 bg-white/50 border border-slate-200 rounded-xl text-sm font-bold outline-none focus:ring-2 focus:ring-indigo-500/20" required>
                <option value="" disabled selected>Pilih Satuan</option>
                <optgroup label="Satuan Umum">
                    <option value="Pcs">Pcs</option><option value="Unit">Unit</option><option value="Pasang">Pasang</option>
                    <option value="Lusin">Lusin</option><option value="Kodi">Kodi</option><option value="Gross">Gross</option>
                    <option value="Rim">Rim</option><option value="Set">Set</option><option value="Karton / Boks / Dus">Karton / Boks / Dus</option>
                    <option value="Pak / Pack">Pak / Pack</option><option value="Ba">Ba</option><option value="Palet">Palet</option>
                </optgroup>
                <optgroup label="Satuan Panjang">
                    <option value="Kilometer (km)">Kilometer (km)</option>
                    <option value="meter (m)">meter (m)</option>
                    <option value="centimeter (cm)">centimeter (cm)</option>
                    <option value="milimeter (mm)">milimeter (mm)</option>
                </optgroup>
                <optgroup label="Satuan Berat">
                    <option value="Kilogram (kg)">Kilogram (kg)</option><option value="gram (g)">gram (g)</option>
                    <option value="pon (lb)">pon (lb)</option><option value="ons">ons</option>
                </optgroup>
                <optgroup label="Satuan Volume">
                    <option value="Liter (L)">Liter (L)</option><option value="mililiter (ml)">mililiter (ml)</option><option value="galon (gal)">galon (gal)</option>
                </optgroup>
                <optgroup label="Satuan Luas">
                    <option value="Meter persegi (m²)">Meter persegi (m²)</option><option value="meter kubik (m³)">meter kubik (m³)</option>
                </optgroup>
            </select>`;

        function formatTanggalID(dateStr) {
            if (!dateStr) return "-";
            const str = String(dateStr).replace(/^'/, '');
            const match = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) return `${match[3]}/${match[2]}/${match[1]}`;
            try { const d = new Date(dateStr); if (!isNaN(d.getTime())) return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; } catch (e) {}
            return String(dateStr);
        }

        function getDateString(dateVal) {
            if (!dateVal) return "";
            const str = String(dateVal).replace(/^'/, '');
            const match = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
            if (match) return match[0];
            try { const d = new Date(dateVal); if (!isNaN(d.getTime())) return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; } catch (e) {}
            return str;
        }

        async function handleLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const btn = document.getElementById('btnLogin');
            if (!user || !pass) return showToast("Mohon isi username dan password!", "rose");
            btn.disabled = true; btn.innerHTML = `<span class="animate-pulse">Menghubungkan...</span>`;
            try {
                const response = await fetch(`${GOOGLE_SCRIPT_URL}?action=login&user=${encodeURIComponent(user)}&pass=${encodeURIComponent(pass)}`);
                const result = await response.json();
                if (result.status === "success") {
                    currentUser = result.data;
                    localStorage.setItem('sarpras_session', JSON.stringify(currentUser));
                    showMainPage();
                    showToast("Selamat Datang, " + currentUser.nama, "emerald");
                } else { showToast(result.message || "Gagal Login!", "rose"); }
            } catch (e) { showToast("Kesalahan Jaringan!", "rose"); }
            finally { btn.disabled = false; btn.innerText = "Masuk Aplikasi"; }
        }

        function showMainPage() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            document.getElementById('displayNama').innerText = currentUser.nama;
            document.getElementById('displayRole').innerText = currentUser.jabatan + " • " + currentUser.role.toUpperCase();
            renderNavMenu();
        }

        function handleLogout() {
            localStorage.removeItem('sarpras_session');
            currentUser = null;
            document.getElementById('mainPage').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('loginUser').value = "";
            document.getElementById('loginPass').value = "";
            showToast("Berhasil Logout", "emerald");
        }

        function renderNavMenu() {
            const nav = document.getElementById('navMenu');
            nav.innerHTML = '';
            const menus = [];
            if (currentUser.role === 'admin') { menus.push({ id: 'dashboard', label: 'Dashboard Data', icon: 'layout-dashboard' }); menus.push({ id: 'inputBantuan', label: 'Input Bantuan', icon: 'gift' }); }
            if (currentUser.role === 'bendahara' || currentUser.role === 'admin') { menus.push({ id: 'inputBarang', label: 'Input Barang/Bahan', icon: 'package-plus' }); }
            menus.push({ id: 'laporanRusak', label: 'Lapor Alat Rusak', icon: 'triangle-alert' });
            menus.push({ id: 'peminjaman', label: 'Peminjaman Barang', icon: 'hand-platter' });
            menus.push({ id: 'pengeluaran', label: 'Pengeluaran Barang', icon: 'package-minus' });

            const order = ['dashboard', 'inputBarang', 'inputBantuan', 'laporanRusak', 'peminjaman', 'pengeluaran'];
            menus.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
            menus.forEach((menu, index) => {
                const btn = document.createElement('button');
                btn.className = `nav-btn glass-card p-4 rounded-2xl flex flex-col items-center justify-center gap-2 text-slate-600 hover:bg-white/50 ${index === 0 ? 'active' : ''}`;
                btn.innerHTML = `<i data-lucide="${menu.icon}" class="w-6 h-6"></i><span class="text-[10px] font-black uppercase tracking-wider text-center leading-tight">${menu.label}</span>`;
                btn.onclick = () => loadView(menu.id, btn);
                nav.appendChild(btn);
            });
            lucide.createIcons();
            if(menus.length > 0) loadView(menus[0].id, nav.firstChild);
        }

        function loadView(viewId, activeBtn) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            if(activeBtn) activeBtn.classList.add('active');
            const content = document.getElementById('contentArea');
            content.innerHTML = `<div class="flex flex-col items-center py-12 space-y-4"><div class="w-10 h-10 border-4 border-indigo-600 rounded-full border-t-transparent animate-spin"></div><p class="text-xs font-bold text-slate-400 uppercase">Memuat Data...</p></div>`;
            setTimeout(() => {
                if (viewId === 'dashboard') renderDashboard(content);
                else if (viewId === 'inputBarang') renderFormInputBarang(content);
                else if (viewId === 'laporanRusak') renderFormLaporanRusak(content);
                else if (viewId === 'peminjaman') renderFormPeminjaman(content);
                else if (viewId === 'inputBantuan') renderFormBantuan(content);
                else if (viewId === 'pengeluaran') renderFormPengeluaran(content);
                lucide.createIcons();
            }, 300);
        }

        function renderDashboard(container) {
            container.innerHTML = `
                <div class="flex flex-col md:flex-row md:items-center justify-between mb-6 gap-4">
                    <h2 class="text-lg font-black text-slate-800 flex items-center gap-2"><i data-lucide="layout-dashboard" class="w-5 h-5 text-indigo-500"></i> Dashboard Data</h2>
                </div>
                <div class="flex flex-wrap gap-2 mb-6 p-2 bg-white/30 rounded-2xl overflow-x-auto">
                    <button onclick="switchDashboardTab('inventaris')" id="tab-inventaris" class="tab-btn active flex items-center gap-2 whitespace-nowrap"><i data-lucide="package" class="w-4 h-4"></i> Inventaris</button>
                    <button onclick="switchDashboardTab('bantuan')" id="tab-bantuan" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="gift" class="w-4 h-4"></i> Bantuan</button>
                    <button onclick="switchDashboardTab('rusak')" id="tab-rusak" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="triangle-alert" class="w-4 h-4"></i> Barang Rusak</button>
                    <button onclick="switchDashboardTab('peminjaman')" id="tab-peminjaman" class="tab-btn flex items-center gap-2 whitespace-nowrap"><i data-lucide="hand-platter" class="w-4 h-4"></i> Peminjaman</button>

        function populateDateOptions(selectId, data, dateField) {
            const select = document.getElementById(selectId);
            if (!select) return;
            select.innerHTML = '<option value="">Semua Tanggal</option>';
            const dates = [...new Set(data.map(d => getDateString(d[dateField])).filter(Boolean))].sort().reverse();
            dates.forEach(d => {
                const opt = document.createElement('option');
                opt.value = d; opt.innerText = formatTanggalID(d);
                select.appendChild(opt);
            });
        }

        function applyFilter(type) {
            if (type === 'inventaris') {
                const f = { nama: document.getElementById('filterNama').value.toLowerCase(), tanggal: document.getElementById('filterTanggal').value, sumber: document.getElementById('filterSumber').value, kondisi: document.getElementById('filterKondisi').value, lokasi: document.getElementById('filterLokasi').value.toLowerCase() };
                const filtered = allInventoryData.filter(row => {
                    const rowDate = getDateString(row.tanggal_perolehan);
                    return (!f.nama || String(row.nama).toLowerCase().includes(f.nama)) && (!f.tanggal || rowDate === f.tanggal) && (!f.sumber || String(row.sumber_dana) === f.sumber) && (!f.kondisi || String(row.kondisi) === f.kondisi) && (!f.lokasi || String(row.lokasi).toLowerCase().includes(f.lokasi));
                });
                renderInventarisTable(filtered);
            } else if (type === 'bantuan') {
                const f = { nama: document.getElementById('filterBantuanNama').value.toLowerCase(), tanggal: document.getElementById('filterBantuanTanggal').value, sumber: document.getElementById('filterBantuanSumber').value };
                const filtered = allBantuanData.filter(row => {
                    const rowDate = getDateString(row.tanggal_perolehan);
                    return (!f.nama || String(row.nama_barang).toLowerCase().includes(f.nama)) && (!f.tanggal || rowDate === f.tanggal) && (!f.sumber || String(row.sumber_bantuan) === f.sumber);
                });
                renderBantuanTable(filtered);
            } else if (type === 'rusak') {
                const f = { nama: document.getElementById('filterRusakNama').value.toLowerCase(), lokasi: document.getElementById('filterRusakLokasi').value.toLowerCase() };
                const filtered = allRusakData.filter(row => (!f.nama || String(row.nama_barang).toLowerCase().includes(f.nama)) && (!f.lokasi || String(row.lokasi).toLowerCase().includes(f.lokasi)));
                renderRusakTable(filtered);
            } else if (type === 'peminjaman') {
                const f = { nama: document.getElementById('filterPinjamNama').value.toLowerCase(), peminjam: document.getElementById('filterPinjamPeminjam').value };
                const filtered = allPeminjamanData.filter(row => (!f.nama || String(row.nama_alat).toLowerCase().includes(f.nama)) && (!f.peminjam || String(row.keterangan_peminjam) === f.peminjam));
                renderPeminjamanTable(filtered);
            } else if (type === 'pengeluaran') {
                const f = { nama: document.getElementById('filterKeluarNama').value.toLowerCase(), penerima: document.getElementById('filterKeluarPenerima').value.toLowerCase() };
                const filtered = allPengeluaranData.filter(row => (!f.nama || String(row.nama_barang).toLowerCase().includes(f.nama)) && (!f.penerima || String(row.nama_penerima).toLowerCase().includes(f.penerima)));
                renderPengeluaranTable(filtered);
            }
        }

        function resetFilter(type) {
            if (type === 'inventaris') ['filterNama', 'filterTanggal', 'filterSumber', 'filterKondisi', 'filterLokasi'].forEach(id => document.getElementById(id).value = '');
            else if (type === 'bantuan') ['filterBantuanNama', 'filterBantuanTanggal', 'filterBantuanSumber'].forEach(id => document.getElementById(id).value = '');
            else if (type === 'rusak') ['filterRusakNama', 'filterRusakLokasi'].forEach(id => document.getElementById(id).value = '');
            else if (type === 'peminjaman') ['filterPinjamNama', 'filterPinjamPeminjam'].forEach(id => document.getElementById(id).value = '');
            else if (type === 'pengeluaran') ['filterKeluarNama', 'filterKeluarPenerima'].forEach(id => document.getElementById(id).value = '');
            applyFilter(type);
        }

        function getActionButtons(sheet, row) {
    if (!currentUser || currentUser.role !== 'admin') return '<td></td>';
    return `<td class="text-center align-middle">
        <div class="flex gap-1 justify-center items-center">

            </button>
            <button onclick="deleteData('${sheet}', '${row.id}')" class="tap-scale p-2 bg-rose-500 text-white rounded-lg hover:bg-rose-600 transition-colors" title="Hapus">
                <i data-lucide="trash-2" class="w-3 h-3"></i>
            </button>
        </div>
    </td>`;
}

        function renderInventarisTable(data) {
            const tbody = document.getElementById('tbodyInventaris');
            if (!tbody) return; tbody.innerHTML = '';
            const isAdmin = currentUser && currentUser.role === 'admin';
            if (data.length === 0) { tbody.innerHTML = `<tr><td colspan="${isAdmin ? '14' : '13'}" class="text-center py-8 text-slate-400 font-bold">Tidak ada data</td></tr>`; return; }
            data.slice(-50).reverse().forEach(row => {
                const tr = document.createElement('tr');
                const tgl = row.timestamp ? formatTanggalID(row.timestamp) : '-';
                const tglPerolehan = formatTanggalID(row.tanggal_perolehan);
                const harga = row.harga ? 'Rp ' + Number(row.harga).toLocaleString('id-ID') : '-';
                const makeLink = (url) => url && url !== '-' ? `<a href="${url}" target="_blank" class="text-indigo-600 hover:underline font-bold text-[10px]">Lihat</a>` : '-';
                const makeMultipleLinks = (urlStr) => {
                    if (!urlStr || urlStr === '-') return '-';
                    const urls = String(urlStr).split(' | ').filter(u => u.trim());
                    if (urls.length === 0) return '-';
                    return urls.map((u, i) => `<a href="${u.trim()}" target="_blank" class="text-indigo-600 hover:underline font-bold text-[10px]">Bukti ${i+1}</a>`).join('<br>');
                };
                tr.innerHTML = `<td>${tgl}</td><td>${row.jenis || '-'}</td><td class="font-bold text-slate-700">${row.nama || '-'}</td><td>${row.kode || '-'}</td><td>${tglPerolehan}</td><td><span class="px-2 py-1 bg-indigo-50 text-indigo-600 rounded-md text-[9px] font-black">${row.sumber_dana || '-'}</span></td><td>${row.jumlah || '-'}</td><td>${row.satuan || '-'}</td><td>${harga}</td><td>${row.kondisi || '-'}</td><td>${row.lokasi || '-'}</td><td>${makeMultipleLinks(row.bukti_pembelian)}</td><td>${makeLink(row.foto_barang)}</td>${getActionButtons('Inventaris', row)}`;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function renderBantuanTable(data) {
            const tbody = document.getElementById('tbodyBantuan');

        // ================= MODAL EDIT STATUS =================
        function openStatusModal(sheet, uniqueId, itemName, currentStatus, statusColumn, availableStatuses) {
            if (currentUser.role !== 'admin') { showToast("Hanya admin yang dapat mengubah status!", "rose"); return; }
            currentEditItem = { sheet, uniqueId, itemName, currentStatus, statusColumn };
            selectedNewStatus = null;
            document.getElementById('modalItemName').innerText = itemName;
            document.getElementById('modalCurrentStatus').innerText = currentStatus;
            const optionsContainer = document.getElementById('modalStatusOptions');
            optionsContainer.innerHTML = '';
            availableStatuses.forEach(status => {
                if (status === currentStatus) return;
                const isGreen = status === 'Sudah Diperbaiki' || status === 'Telah Dikembalikan';
                const btn = document.createElement('button');
                btn.className = `tap-scale w-full px-4 py-3 rounded-xl text-xs font-black uppercase tracking-wider border-2 transition-all flex items-center justify-center gap-2 ${isGreen ? 'border-emerald-200 bg-emerald-50 text-emerald-700 hover:bg-emerald-100' : 'border-rose-200 bg-rose-50 text-rose-700 hover:bg-rose-100'}`;
                btn.innerHTML = `<i data-lucide="${isGreen ? 'check-circle' : 'alert-circle'}" class="w-4 h-4"></i><span>${status}</span>`;
                btn.onclick = () => selectNewStatus(status, btn);
                optionsContainer.appendChild(btn);
            });
            document.getElementById('statusModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            lucide.createIcons();
        }

        function selectNewStatus(status, btnElement) {
            selectedNewStatus = status;
            document.querySelectorAll('#modalStatusOptions button').forEach(b => b.classList.remove('ring-4', 'ring-indigo-500/30', 'border-indigo-500'));
            btnElement.classList.add('ring-4', 'ring-indigo-500/30', 'border-indigo-500');
        }

        function closeStatusModal() {
            document.getElementById('statusModal').classList.add('hidden');
            document.body.style.overflow = '';
            currentEditItem = null; selectedNewStatus = null;
        }

        async function confirmStatusChange() {
            if (!selectedNewStatus || !currentEditItem) { showToast("Pilih status baru terlebih dahulu!", "amber"); return; }
            const btn = document.getElementById('btnConfirmStatus');
            const originalHTML = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `<span class="animate-pulse">Menyimpan...</span>`;
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "updateStatus", sheet: currentEditItem.sheet, uniqueId: currentEditItem.uniqueId, status: selectedNewStatus, statusColumn: currentEditItem.statusColumn }) });
                const result = await response.json();
                if (result.status === "success") {
                    showToast(result.message, "emerald");
                    closeStatusModal();
                    const activeTab = document.querySelector('.tab-btn.active');
                    if (activeTab) {
                        const tabId = activeTab.id.replace('tab-', '');
                        if (tabId === 'rusak') fetchRusakData();
                        else if (tabId === 'peminjaman') fetchPeminjamanData();
                    }
                } else { showToast(result.message || "Gagal mengubah status!", "rose"); }
            } catch (err) { showToast("Gagal terhubung ke server!", "rose"); }
            finally { btn.disabled = false; btn.innerHTML = originalHTML; }
        }

        async function saveEditData() {
            if (!currentEditRow || !currentEditSheet) return;
            const fields = {
                'Inventaris': ['nama', 'jumlah', 'harga', 'lokasi', 'keterangan'],
                'Bantuan': ['nama_barang', 'jumlah', 'merek', 'lokasi', 'keterangan'],
                'LaporanRusak': ['nama_barang', 'jumlah', 'lokasi', 'deskripsi_kerusakan'],
                'Peminjaman': ['nama_alat', 'jumlah', 'keterangan'],
                'Pengeluaran': ['nama_barang', 'jumlah', 'peruntukan', 'nama_penerima']
            };
            const updates = {};
            (fields[currentEditSheet] || []).forEach(field => {
                const el = document.getElementById(`edit_${field}`);
                if (el) updates[field] = field === 'jumlah' || field === 'harga' ? Number(el.value) : el.value;
            });

            const btn = document.querySelector('#editModal button[onclick="saveEditData()"]');
            const originalText = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = `<span class="animate-pulse">Menyimpan...</span>`;

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify({ action: "updateData", sheet: currentEditSheet, id: currentEditRow.id, updates: updates }) });
                const result = await response.json();
                if (result.status === "success") {
                    showToast("Data berhasil diperbarui!", "emerald");
                    closeEditModal();
                    const activeTab = document.querySelector('.tab-btn.active');
                    if (activeTab) {
                        const tabId = activeTab.id.replace('tab-', '');
                        if (tabId === 'inventaris') fetchInventoryData();
                        else if (tabId === 'bantuan') fetchBantuanData();
                        else if (tabId === 'rusak') fetchRusakData();
                        else if (tabId === 'peminjaman') fetchPeminjamanData();
                        else if (tabId === 'pengeluaran') fetchPengeluaranData();
                    }
                } else { showToast(result.message, "rose"); }
            } catch (err) { showToast("Gagal terhubung ke server!", "rose"); }
            finally { btn.disabled = false; btn.innerHTML = originalText; }
        }

        // ================= EXPORT EXCEL =================
        function exportToExcel(type) {
            let data, headers, fileName, urlColumns;
            if (type === 'Inventaris') {
                data = allInventoryData;
                headers = ['Tanggal Input', 'Jenis', 'Nama', 'Kode', 'Tgl. Perolehan', 'Sumber Dana', 'Jumlah', 'Satuan', 'Harga', 'Kondisi', 'Lokasi', 'Keterangan', 'Bukti Pembelian', 'Foto Barang', 'Input Oleh'];
                fileName = `Data_Inventaris_${new Date().toISOString().slice(0,10)}.xlsx`;
                urlColumns = [12, 13];
            } else if (type === 'Bantuan') {
                data = allBantuanData;
                headers = ['Tanggal Input', 'Nama Barang', 'Tgl. Perolehan', 'Jumlah', 'Satuan', 'Merek', 'Sumber Bantuan', 'Kondisi', 'Lokasi', 'Keterangan', 'Foto Barang', 'Input Oleh'];
                fileName = `Data_Bantuan_${new Date().toISOString().slice(0,10)}.xlsx`;
                urlColumns = [10];
            } else if (type === 'Rusak') {
                data = allRusakData;
                headers = ['Tanggal Input', 'Nama Barang', 'Lokasi', 'Jumlah', 'Satuan', 'Deskripsi Kerusakan', 'Foto Rusak', 'Pelapor', 'Status'];
                fileName = `Data_Barang_Rusak_${new Date().toISOString().slice(0,10)}.xlsx`;
                urlColumns = [6];
            } else if (type === 'Peminjaman') {
                data = allPeminjamanData;
                headers = ['Tanggal Input', 'Nama Alat', 'Peminjam', 'Jumlah', 'Satuan', 'Keterangan', 'Foto Barang', 'Status'];
                fileName = `Data_Peminjaman_${new Date().toISOString().slice(0,10)}.xlsx`;
                urlColumns = [6];
            } else if (type === 'Pengeluaran') {
                data = allPengeluaranData;
                headers = ['Tanggal Input', 'Tgl. Pengeluaran', 'Nama Barang', 'Jumlah', 'Satuan', 'Peruntukan', 'Tgl. Penyerahan', 'Penerima', 'Input Oleh'];
                fileName = `Data_Pengeluaran_${new Date().toISOString().slice(0,10)}.xlsx`;
                urlColumns = [];
            }
            
            if (!data || data.length === 0) { showToast("Tidak ada data untuk diunduh!", "rose"); return; }
            const excelData = [headers];
            data.forEach(row => {
                let excelRow = [];
                if (type === 'Inventaris') {
                    excelRow = [row.timestamp ? formatTanggalID(row.timestamp) : '', row.jenis || '', row.nama || '', row.kode || '', row.tanggal_perolehan ? formatTanggalID(row.tanggal_perolehan) : '', row.sumber_dana || '', row.jumlah || '', row.satuan || '', row.harga ? Number(row.harga) : 0, row.kondisi || '', row.lokasi || '', row.keterangan || '', row.bukti_pembelian || '', row.foto_barang || '', row.input_oleh || ''];
                } else if (type === 'Bantuan') {
                    excelRow = [row.timestamp ? formatTanggalID(row.timestamp) : '', row.nama_barang || '', row.tanggal_perolehan ? formatTanggalID(row.tanggal_perolehan) : '', row.jumlah || '', row.satuan || '', row.merek || '', row.sumber_bantuan || '', row.kondisi || '', row.lokasi || '', row.keterangan || '', row.foto_barang || '', row.input_oleh || ''];
                } else if (type === 'Rusak') {
                    excelRow = [row.timestamp ? formatTanggalID(row.timestamp) : '', row.nama_barang || '', row.lokasi || '', row.jumlah || '', row.satuan || '', row.deskripsi_kerusakan || '', row.foto_rusak || '', row.pelapor || '', row.status || 'Rusak'];
                } else if (type === 'Peminjaman') {
                    excelRow = [row.timestamp ? formatTanggalID(row.timestamp) : '', row.nama_alat || '', row.peminjam || '', row.jumlah || '', row.satuan || '', row.keterangan || '', row.foto_barang || '', row.status || 'Dipinjam'];
                } else if (type === 'Pengeluaran') {
                    excelRow = [row.timestamp ? formatTanggalID(row.timestamp) : '', row.tanggal_pengeluaran ? formatTanggalID(row.tanggal_pengeluaran) : '', row.nama_barang || '', Number(row.jumlah) || 0, row.satuan || 'Pcs', row.peruntukan || '', row.tanggal_penyerahan ? formatTanggalID(row.tanggal_penyerahan) : '', row.nama_penerima || '', row.input_oleh || ''];
                }
                excelData.push(excelRow);
            });
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(excelData);
            urlColumns.forEach(colIndex => {
                for (let i = 1; i < excelData.length; i++) {
                    const cellAddress = XLSX.utils.encode_cell({ r: i, c: colIndex });
                    const cell = ws[cellAddress];
                    if (cell && cell.v && String(cell.v).startsWith('http')) {
                        cell.l = { Target: cell.v };
                        cell.s = { font: { color: { rgb: "0000FF" }, u: "single" } };
                    }
                }
            });
            const colWidths = headers.map(h => ({ wch: Math.max(h.length + 2, 15) }));
            ws['!cols'] = colWidths;
            const headerStyle = { font: { bold: true, color: { rgb: "FFFFFF" } }, fill: { fgColor: { rgb: "6366F1" } }, alignment: { horizontal: "center" } };
            for (let c = 0; c < headers.length; c++) ws[XLSX.utils.encode_cell({ r: 0, c: c })].s = headerStyle;
            XLSX.utils.book_append_sheet(wb, ws, type);
            XLSX.writeFile(wb, fileName);
            showToast(`File Excel ${type} berhasil diunduh dengan ${data.length} data!`, "emerald");
        }

        function initSearchableDropdown() {
            const input = document.getElementById('inv_nama');
            const dropdown = document.getElementById('namaDropdown');
            const kodeInput = document.getElementById('inv_kode');
            if (!input || !dropdown) return;
            if (kodeBarangData.length === 0) fetchKodeBarang();
            
            input.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                dropdown.innerHTML = '';
                if (query.length < 2) { dropdown.classList.remove('active'); return; }
                const filtered = kodeBarangData.filter(item => item.nama_barang && item.nama_barang.toLowerCase().includes(query));
                if (filtered.length === 0) {
                    dropdown.innerHTML = '<div class="no-results">Barang tidak ditemukan</div>';
                    dropdown.classList.add('active');
                } else {
                    filtered.slice(0, 10).forEach(item => {
                        const div = document.createElement('div');
                        div.className = 'dropdown-item';
                        div.innerHTML = `<div class="font-bold text-sm">${item.nama_barang}</div><small class="text-slate-500">Kode: ${item.kode_barang || '-'}</small>`;
                        div.onclick = () => {
                            input.value = item.nama_barang;
                            kodeInput.value = item.kode_barang || '';
                            dropdown.classList.remove('active');
                        };
                        dropdown.appendChild(div);
                    });
                    dropdown.classList.add('active');
                }
            });
            document.addEventListener('click', function(e) {
                if (!input.contains(e.target) && !dropdown.contains(e.target)) dropdown.classList.remove('active');
            });
        }

        function renderUploadSection(idPrefix, label, isMultiple) {
            const maxText = isMultiple ? ' (Maks. 5 Foto)' : '';
            const acceptType = isMultiple ? 'image/*' : 'image/*,application/pdf';
            const multipleAttr = isMultiple ? 'multiple' : '';
            return `
                <div class="space-y-2">
                    <label class="text-[10px] font-black text-slate-500 uppercase">${label}</label>
                    <div class="upload-area" onclick="document.getElementById('input_${idPrefix}').click()">
                        <div class="upload-placeholder" id="placeholder_${idPrefix}">
                            <i data-lucide="camera" class="w-8 h-8 mx-auto mb-1"></i>
                            <p class="text-xs font-bold">Klik untuk upload${maxText}</p>
                        </div>
                        <div class="preview-grid" id="grid_${idPrefix}"></div>
                    </div>
                    <input type="file" id="input_${idPrefix}" accept="${acceptType}" ${multipleAttr} class="hidden" onchange="handleFileSelect(event, '${idPrefix}', ${isMultiple})">
                    <p class="text-[9px] text-slate-400 font-bold text-right"><span id="count_${idPrefix}">0</span> file dipilih</p>
                </div>`;
        }

        async function handleFileSelect(event, idPrefix, isMultiple) {
            const files = Array.from(event.target.files);
            if (isMultiple && files.length > 5) { showToast("Maksimal 5 foto yang diizinkan!", "rose"); event.target.value = ''; return; }
            const grid = document.getElementById(`grid_${idPrefix}`);
            const placeholder = document.getElementById(`placeholder_${idPrefix}`);
            const countLabel = document.getElementById(`count_${idPrefix}`);
            grid.innerHTML = ''; placeholder.classList.add('hidden');
            if (isMultiple) {
                const arrayKey = idPrefix === 'bukti_pembelian' ? 'currentBuktiMultiple' : 'currentImagesBase64';
                window[arrayKey] = [];
                for (let i = 0; i < files.length; i++) {
                    const compressed = await compressImage(files[i]);
                    window[arrayKey].push(compressed);
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `<img src="${compressed}"><div class="remove-photo-btn" onclick="removeImage('${idPrefix}', ${i}, event)"><i data-lucide="x" class="w-3 h-3"></i></div>`;
                    grid.appendChild(div);
                }
                countLabel.innerText = window[arrayKey].length;
            } else {
                const compressed = await compressImage(files[0]);
                currentBuktiBase64 = compressed;
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${compressed}"><div class="remove-photo-btn" onclick="removeSingleImage('${idPrefix}', event)"><i data-lucide="x" class="w-3 h-3"></i></div>`;
                grid.appendChild(div);
                countLabel.innerText = "1";
            }
            lucide.createIcons();
        }

        function compressImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width, height = img.height;
                        const maxWidth = 800; 
                        if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); 
                    };
                };
            });
        }

        function removeImage(idPrefix, index, event) {
            event.stopPropagation();
            const arrayKey = idPrefix === 'bukti_pembelian' ? 'currentBuktiMultiple' : 'currentImagesBase64';
            window[arrayKey].splice(index, 1);
            const grid = document.getElementById(`grid_${idPrefix}`);
            grid.innerHTML = '';
            window[arrayKey].forEach((img, i) => {
                const div = document.createElement('div');
                div.className = 'preview-item';
                div.innerHTML = `<img src="${img}"><div class="remove-photo-btn" onclick="removeImage('${idPrefix}', ${i}, event)"><i data-lucide="x" class="w-3 h-3"></i></div>`;
                grid.appendChild(div);
            });
            document.getElementById(`count_${idPrefix}`).innerText = window[arrayKey].length;
            if (window[arrayKey].length === 0) document.getElementById(`placeholder_${idPrefix}`).classList.remove('hidden');
            lucide.createIcons();
        }

        function removeSingleImage(idPrefix, event) {
            event.stopPropagation();
            currentBuktiBase64 = "";
            document.getElementById(`grid_${idPrefix}`).innerHTML = '';
            document.getElementById(`placeholder_${idPrefix}`).classList.remove('hidden');
            document.getElementById(`count_${idPrefix}`).innerText = "0";
            document.getElementById(`input_${idPrefix}`).value = '';
        }

            const jumlah = document.getElementById('pinjam_jumlah').value;
            const satuan = document.getElementById('pinjam_satuan').value;
            const keterangan = document.getElementById('pinjam_keterangan').value;
            
            if (!nama || !ket || !jumlah || !satuan || !keterangan) {
                showToast("Mohon lengkapi semua field yang wajib diisi!", "rose"); return;
            }
            
            const data = { action: "peminjaman", nama_alat: nama, keterangan_peminjam: ket, jumlah: parseInt(jumlah) || 1, satuan, keterangan, foto_barang: currentImagesBase64, peminjam: currentUser.nama };
            await sendData(data, "btnSubmitPinjam", "Alat yang sudah dipinjam dapat dirawat dan dikembalikan segera maksimal 2 hari setelah peminjaman.", "amber");
            
            document.getElementById('pinjam_nama').value = '';
            document.getElementById('pinjam_ket').value = 'Guru';
            document.getElementById('pinjam_jumlah').value = '';
            document.getElementById('pinjam_satuan').value = '';
            document.getElementById('pinjam_keterangan').value = '';
            resetAllUploads();
        }

        function resetAllUploads() {
            currentImagesBase64 = []; 
            currentBuktiBase64 = "";
            currentBuktiMultiple = [];
            document.querySelectorAll('.preview-grid').forEach(g => g.innerHTML = '');
            document.querySelectorAll('.upload-placeholder').forEach(p => p.classList.remove('hidden'));
            document.querySelectorAll('[id^="count_"]').forEach(c => c.innerText = "0");
            document.querySelectorAll('input[type="file"]').forEach(i => i.value = '');
        }

        async function sendData(payload, btnId, successMsg, color) {
            const btn = document.getElementById(btnId);
            const originalText = btn.innerText;
            btn.disabled = true; btn.innerHTML = `<span class="animate-pulse">Menyimpan & Mengupload...</span>`;
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                if (result.status === "success") showToast(successMsg, color);
                else showToast("Gagal: " + result.message, "rose");
            } catch (err) { showToast("Gagal terhubung ke server!", "rose"); }
            finally { btn.disabled = false; btn.innerText = originalText; }
        }

        function showToast(message, color) {
            const toast = document.getElementById('statusToast');
            const content = document.getElementById('toastContent');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMessage').textContent = message;
            if (color === 'emerald') {
                content.className = "aero-blur bg-white/95 border border-emerald-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-emerald-600";
                icon.setAttribute('data-lucide', 'check-circle');
            } else if (color === 'amber') {
                content.className = "aero-blur bg-white/95 border border-amber-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-amber-600";
                icon.setAttribute('data-lucide', 'alert-triangle');
            } else {
                content.className = "aero-blur bg-white/95 border border-rose-500/20 px-6 py-4 rounded-3xl shadow-2xl flex items-center gap-3 text-rose-600";
                icon.setAttribute('data-lucide', 'alert-circle');
            }
            lucide.createIcons();
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        document.getElementById('statusModal').addEventListener('click', (e) => {
            if (e.target.id === 'statusModal') closeStatusModal();
        });

        window.onload = () => {
            const saved = localStorage.getItem('sarpras_session');
            if (saved) { currentUser = JSON.parse(saved); showMainPage(); }
        };
    </script>
</body>
</html>
